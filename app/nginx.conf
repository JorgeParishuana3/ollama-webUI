
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/version {
        if ($request_method != GET) { return 405; }
        proxy_pass http://ai-ollama:11434/api/version;
    }

    location = /api/tags {
        if ($request_method != GET) { return 405; }
        proxy_pass http://ai-ollama:11434/api/tags;
    }

    location = /api/chat {
        if ($request_method != POST) { return 405; }
        proxy_pass http://ai-ollama:11434/api/chat;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }
}
