
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $ollama_upstream ai-ollama:11434;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/version {
        if ($request_method != GET) { return 405; }
        proxy_pass http://$ollama_upstream/api/version$is_args$args;
    }

    location = /api/tags {
        if ($request_method != GET) { return 405; }
        proxy_pass http://$ollama_upstream/api/tags$is_args$args;
    }

    location = /api/chat {
        if ($request_method != POST) { return 405; }
        proxy_pass http://$ollama_upstream/api/chat$is_args$args;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }
}
